name: Build & attach release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          else
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Extract Tag Version
        id: vars
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PappVersionName="${{ steps.vars.outputs.version }}" \
            -PtargetAbi="arm64-v8a"

      - name: Build Debug APK
        run: |
          ./gradlew --no-daemon assembleDebug \
            -PappVersionName="${{ steps.vars.outputs.version }}" \
            -PtargetAbi="arm64-v8a"

      - name: Prepare APKs
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          cp app/build/outputs/apk/release/*.apk "MockX-v${VERSION}-arm64-v8a-release.apk" 2>/dev/null || true
          cp app/build/outputs/apk/debug/app-debug.apk "MockX-v${VERSION}-arm64-v8a-debug.apk" 2>/dev/null || true
          ls -lh MockX-*.apk

      - name: Upload APKs to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" MockX-*.apk --clobber
