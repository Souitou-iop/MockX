name: Build ARM64-v8a APK

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name'
        required: false
        default: '1.0beta'
        type: string
      target_abi:
        description: 'Target ABI (e.g. arm64-v8a or all)'
        required: false
        default: 'arm64-v8a'
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build MockX APK (ARM64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Resolve Version Name & ABI
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version_name }}" ]; then
            VERSION="${{ inputs.version_name }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="1.0beta"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.target_abi }}" ]; then
            ABI="${{ inputs.target_abi }}"
          else
            ABI="arm64-v8a"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "abi=${ABI}" >> $GITHUB_OUTPUT
          echo "Building MockX version ${VERSION} for ABI ${ABI}"

      - name: Configure Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Restoring keystore from DEBUG_KEYSTORE_BASE64 secret..."
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          else
            echo "Generating default debug keystore..."
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PappVersionName="${{ steps.vars.outputs.version }}" \
            -PtargetAbi="${{ steps.vars.outputs.abi }}"

      - name: Build Debug APK
        run: |
          ./gradlew --no-daemon assembleDebug \
            -PappVersionName="${{ steps.vars.outputs.version }}" \
            -PtargetAbi="${{ steps.vars.outputs.abi }}"

      - name: Prepare APK Artifacts
        run: |
          mkdir -p output_apks
          VERSION="${{ steps.vars.outputs.version }}"
          ABI="${{ steps.vars.outputs.abi }}"

          RELEASE_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DEBUG_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          if [ -f "$RELEASE_SRC" ]; then
            cp "$RELEASE_SRC" "output_apks/MockX-v${VERSION}-${ABI}-release.apk"
            echo "Copied release APK: MockX-v${VERSION}-${ABI}-release.apk"
          fi

          if [ -f "$DEBUG_SRC" ]; then
            cp "$DEBUG_SRC" "output_apks/MockX-v${VERSION}-${ABI}-debug.apk"
            echo "Copied debug APK: MockX-v${VERSION}-${ABI}-debug.apk"
          fi

          ls -lh output_apks/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MockX-v${{ steps.vars.outputs.version }}-${{ steps.vars.outputs.abi }}-APKs
          path: output_apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apks/*.apk
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
